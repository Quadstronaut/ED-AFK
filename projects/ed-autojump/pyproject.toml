[project]
name = "ed-autojump"
version = "0.2.0"
description = "Autonomous jump + dock domain for Elite Dangerous: Odyssey. Depends on ed-core + ed-vision; never on a sibling domain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Quadstronaut" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

dependencies = [
    "ed-core",
    "ed-vision",
]

[project.optional-dependencies]
# Convenience: pull the engine's extras through the domain so an editable
# `ed-autojump[dev,hotkey,vision]` install still resolves everything (the
# launcher uses exactly that spec).
cv = ["ed-core[cv]"]
vision = ["ed-core[vision]"]
vision-heavy = ["ed-core[vision-heavy]"]
hotkey = ["ed-core[hotkey]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# galmap/fsd/fuel-scoop json + runtime binds follow the jump domain (G11).
ed_autojump = [
    "data/*.json", "binds/*.binds", "edhm-presets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "requires_game: tests that need the live Elite Dangerous game running (skipped by default)",
    "slow: long-running tests",
]
addopts = "-q -m 'not requires_game'"
