# SC restart RESUME — ship already in supercruise, stale (jump_age past the
# fresh window) with a CONFIDENT non-local-star Destination lock. Near-star /
# fresh / indeterminate restarts route to arrival.toml instead
# (dispatcher._maybe_startup priorities 1-3).
#
# CV REWIRE 2026-07-05 (operator: "keep a CV distance gate — if we're 100 Ls
# from the star we can likely just target our next destination and proceed"):
# the blind trio (nav_panel_target max_rows=3 -> sc_assist_orbit -> wait 13s)
# is GONE; #27/#28 died with it (operator-ratified 2026-06-27).
#
# WHY THE IN-SCENE GATE STAYS (live-proven, session_100951): the classifier's
# non-local-star heuristic is NOT a sound clear-of-star proxy — a ship parked
# NOSE-ON its arrival star carries a non-local-star Destination too (ED
# pre-loads the next hop); run 2 (jump_age 88s) was misclassified as a clear
# loiter and set_throttle(100) drove it INTO the star. The gate now reads the
# ACTUAL row-0 distance (CV/OCR) instead of the old lock-speed proxy:
#   < 100 Ls or UNREADABLE -> get-around (nav_supercruise_star + ORBITING
#     wait) BEFORE any throttle — fail-closed, never blind-throttle at a
#     maybe-near star.
#   >= 100 Ls (confidently FAR) -> skip_to the fast resume (the Robigo loiter
#     path: just lock the hop and go — no false-arrival regression).
#
# NO scoop pit-stop (scooping is an arrival-scene concern). The jump leg is
# the standard clearance shape: engage_jump_clearance fails closed on
# obstruction and move-retries.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   vision  CV read / closed-loop steer — EXCLUSIVE where it owns input
#   wait    passive block on journal event / Status flag or CV poll — no input
parallel_tracks = ["honk"]   # honk fires every system, no matter what

[on_required_fail]
# LIVE FIX 2026-07-06 (run 010444 starsmack): retries re-run from the
# CLEAR-OF-STAR GATE, never straight into the fast-resume burn. The old
# target_next_route anchor let a CLOSE-lane fail (nav_supercruise_star
# refused) retry into SetSpeed100 with the nose still on the star — the
# session_100951 failure mode reborn through the retry path, and the exact
# sequence that smacked L 32-8 (gate unreadable -> close lane -> refusal ->
# retry -> full burn -> drop at the star 11s later).
retry_from = "star_distance_gate"
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "set_throttle", pct = 0 },
  { action = "star_distance_gate", skip_to = "target_next_route", threshold_ls = 10.0 },
  { action = "set_throttle", pct = 75 },
  { action = "pitch_star_off", required = true },
  { action = "nav_supercruise_star", required = true },
  { action = "wait", s = 3.33 },
  { action = "wait_sc_assist_orbiting" },
  { action = "confirm_orbiting" },
  { action = "wait", s = 13.0 },
  { action = "target_next_route", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "wait", s = 3.33 },
  { action = "set_throttle", pct = 75 },
  { action = "orient_compass", required = true },
  { action = "orient_widget_ring", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "engage_jump_clearance", required = true },
]
