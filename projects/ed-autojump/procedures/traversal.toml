# TRAVERSAL — the steady-state A->B hyperspace hop. Operator-verbatim sequence
# (MASTER-SPEC "Traversal"): wait 5s -> target_next_route -> set_throttle 100 ->
# wait 5s -> orient_compass -> orient_widget_ring -> engage_jump_clearance.
# (both leading waits bumped 3s->5s per operator 2026-07-07.)
#
# STANDALONE procedure. There is NO goto / chaining primitive (model.py defines
# only Step/OnRequiredFail/Procedure); inter-scene entry (how Arrival / Smack /
# Exploration hand off INTO this) is the C2 deliverable and is OUT OF SCOPE
# here. The loader discovers this file by directory glob (loader.py:79), so
# dropping it in procedures/ IS the registry wiring.
#
# Its jump tail (target_next_route -> set_throttle -> orient_compass ->
# orient_widget_ring -> engage_jump_clearance, with retry_from=target_next_route)
# is byte-for-byte the proven dock_resume.toml tail. Traversal differs only by
# the two LEADING operator waits and by the absence of auto_launch /
# wait_masslock_clear (no station mass lock to clear in steady state).
#
# Honk OMITTED on purpose: Arrival owns honking (design I2). NO parallel_tracks.
#
# step kinds (tag at start of each step comment):
#   wait    passive block — no input sent (here: operator wall-clock pacing)
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   tap     atomic keypress, no precondition
#   vision  closed-loop pitch/yaw + frame capture — EXCLUSIVE, owns input + screen

# BLOCKED-ON-KYLE (carried from C5 design; NOT resolved in this build):
#   B1 inter-scene ENTRY contract (C2-owned) — traversal built standalone here.
#   B2 should `wait 5s` (idx 3) gate on an at-speed Status/journal signal?
#      Operator literal kept verbatim.
#   B3 should `wait 5s` (idx 0) gate on an SC-assist/orbit-acquired signal
#      (esp. the Smack->Traversal path)? Operator literal kept verbatim.
#   B4 Exploration->Traversal entry throttle/SC state (C2/C6-owned).
parallel_tracks = ["honk"]   # honk fires on this arrival like any other
[on_required_fail]
retry_from = "target_next_route"
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "wait", s = 4.20 },
  { action = "wait_sc_assist_orbiting" },
  { action = "confirm_orbiting" },
  { action = "wait", s = 13.0 },
  { action = "target_next_route", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "wait", s = 4.20 },
  { action = "set_throttle", pct = 75 },
  { action = "orient_compass", required = true },
  { action = "wait", s = 1.0 },
  { action = "orient_widget_ring", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "engage_jump_clearance", required = true },
]
