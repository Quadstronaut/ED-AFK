# STATION DOCK terminus (Council B docking rebuild, 2026-07-02) — REBUILT
# against MASTER-SPEC Docking §4 (docs/superpowers/specs/2026-06-17-flow-
# redesign-MASTER-SPEC.md) + memory ed-docking-mechanics. Runs from
# dispatch_route_complete when the route's final waypoint is a STATION
# (D1: Status.Destination.Body != 0 AND Name != current-system-name).
#
# THE FIX THIS REBUILD IS FOR (operator, repeated correction): the OLD
# dock_approach step gated the docking-proximity closing leg on the journal
# ReceiveText "$STATION_NoFireZone_entered;" broadcast. That is WRONG — the
# NO FIRE ZONE is a weapons-off zone ONLY, and it is LARGER than the 7.5km
# docking-request range; it is NEVER a valid docking-range signal. The real
# gate is ACTUAL DISTANCE < 7.5 km, read via CV from the RIGHT-SIDE cockpit
# TARGET PANEL (ed_vision.target_panel_distance) — the only place the km
# distance persists once the bot is on the CONTACTS tab (where REQUEST
# DOCKING lives; the nav-list distance is gone there — C7 finding). This
# file contains NO ReceiveText / NoFireZone gate anywhere.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or Status flag — no input sent
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
#   vision  closed-loop CV read/confirm — may be EXCLUSIVE (see step tags)
parallel_tracks = ["honk"]   # honk fires on the arrival jump like any other

[on_required_fail]
# A required fail from dock_close_to_range or dock_request re-runs the
# READ-DISTANCE approach + REQUEST as one unit — mirrors the old
# retry_from="dock_approach" bounded loop this replaces:
#   - DockingDenied Distance (the request fired just outside 7.5km): re-close
#     from the current position, not from nav_supercruise_target — the ship
#     is already nearby.
#   - dock_close_to_range watchdog (the target-panel distance never resolved
#     inside the bound): re-approach from current position.
# nav_supercruise_target / dock_await_exit / set_throttle are NOT in
# the retry loop — they only run on the FIRST attempt (the interpreter starts
# at step 1 only then; retries start at retry_from). A station that keeps
# denying exhausts max_retries and aborts to human.
retry_from = "dock_close_to_range"
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "nav_supercruise_target", required = true },
  { action = "dock_await_exit", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "dock_close_to_range", required = true },
  { action = "set_throttle", pct = 0 },
  { action = "dock_request", required = true },
  { action = "dock_await_docked", required = true },
  { action = "station_services_macro" },
]
