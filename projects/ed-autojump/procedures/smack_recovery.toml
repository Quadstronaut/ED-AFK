# Reflex: emergency drop INSIDE the star's exclusion zone (SupercruiseExit,
# BodyType:Star) — and the boot-smack overrides (BootCooldownSmackRoute /
# EscapeVectorBootOverride) dispatch HERE too.
#
# v8 ALL-CV (OPERATOR ORDER 2026-07-06: "NO MORE OLD BLIND BULLSHIT ...
# WIRE ALL CV"). The v7 star-lock escape is DEAD: its nav_panel_target blind
# row-walk burned rows 0-4 at ~9s each hunting the star by name while the
# ship sat in the gravity well (run 235430), and its "escape vector on the
# compass" premise was REFUTED live 2026-07-06 — the escape vector is a
# WORLD-SPACE cyan sky marker, not a compass element (operator-flown
# recovery, 168-frame capture; fixtures in tests/fixtures/smack/).
#
# The v8 flow IS the operator's own flown recovery:
#   throttle 0 -> 75% burn through the flip (v7 operator order preserved) ->
#   PITCH THE STAR OFF-SCREEN by CV brightness (sun_avoid mechanism,
#   live-validated 2026-05-24: 0.678 nose-on-star vs 0.005 clear) ->
#   wait the smack cooldown out (flag-gated) -> press supercruise until a
#   charge is LIVE -> throttle 100 -> CENTER THE ESCAPE-VECTOR SKY MARKER
#   (ed_vision.escape_vector_marker: validated on his frames — found in
#   exactly the 23 live-charge frames of 168, zero false positives) and ride
#   it to SupercruiseEntry. Then the in-SC tail: lock the hop, throttle 100,
#   13s clear, orient, jump.
#
# Real space cannot ram a star (ed-fsd-masslock-realspace fact 2), so the
# 75% burn before the pitch is safe — it is the operator's "speed up, turned
# around" from his own recovery.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock — no input sent
#   hold    key down → event → key up; used in parallel honk track
#   vision  closed-loop CV read + pitch/yaw — EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]   # operator 0.5: re-honk in case the earlier one missed

[on_required_fail]
retry_from = "set_throttle"   # first occurrence = step 0 — real-space restart
max_retries = 3
backoff_s = 2.0
# State-aware retry (operator-dictated 2026-06-07: "fail in supercruise -> go
# to target_next_route"): a PRE-anchor required failure with the ship already
# in supercruise resumes at the hop lock instead of re-running the real-space
# ladder in SC (the 14:24Z triple-burn). target_next_route also carries
# retry_anchor, so at-or-after failures already resume there.
retry_from_if_supercruise = "target_next_route"

steps = [
  # ── Real-space recovery during the smack cooldown ────────────────────────
  { action = "set_throttle", pct = 75 },                                                      # tap    | 1 full burn through the flip (operator order, v7-preserved)
  # vision | 2 pitch the star OFF-SCREEN by center-brightness CV — no lock,
  # no panel, no compass. Off-screen (not compass-astern) suffices: the
  # escape-vector orient below completes the turn onto the vector.
  { action = "pitch_star_off", required = true },                                             # vision | 2 EXCLUSIVE — star off-screen
  { action = "wait_cooldown_clear", required = true },                                        # wait   | 3 smack cooldown — FsdCooldown flag-gated, no timer
  # until_charging: success = a LIVE CHARGE, not entry — the charge is what
  # spawns the escape-vector marker. ED refuses the press while deep in the
  # exclusion zone — re-press every 15s (max 3); 240s is the wedged-FSD
  # watchdog, never a success gate. A re-press is only sent when no charge
  # ever started in its window (re-pressing a live charge would CANCEL it).
  { action = "engage_supercruise", required = true, until_charging = true, presses = 3, between_press_s = 15.0, max_charge_s = 240.0 },  # gated | 4 press until a charge is LIVE
  { action = "set_throttle", pct = 100 },                                                     # tap    | 5 full throttle rides the vector out
  # vision | 6 THE ESCAPE: center the cyan ESCAPE VECTOR sky marker and hold
  # it to SupercruiseEntry. Fail-closed: marker lost / charge dropped ->
  # False -> the retry ladder (real-space -> step 0; in-SC -> hop lock).
  { action = "orient_escape_vector", required = true },                                       # vision | 6 EXCLUSIVE — ride the vector to SC entry

  # ── In supercruise: lock the hop, clear the star, jump ───────────────────
  { action = "nav_supercruise_star", required = true },
  { action = "wait_sc_assist_orbiting" },
  { action = "target_next_route", required = true, retry_anchor = true },                     # gated  | 7 hop lock — SC failures return HERE
  { action = "set_throttle", pct = 75 },                                                     # tap    | 8 SC entry reset the throttle
  { action = "wait", s = 3.0 },                                                              # wait   | 8.5 fly clear of the star — TRAJECTORY PACING, not a gate
  { action = "orient_compass", required = true },                                             # vision | 9 EXCLUSIVE coarse
  { action = "orient_widget_ring", required = true },                                         # vision | 10 fine (no-op unless [vision].widget_ring_alignment)
  { action = "set_throttle", pct = 100 },
  { action = "engage_jump_clearance", required = true },                                                # gated  | 11 FSD jump
]
