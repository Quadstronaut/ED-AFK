# Reflex: emergency drop INSIDE the star's exclusion zone (SupercruiseExit,
# BodyType:Star).
#
# v7 (operator-dictated, 2026-06-07): throttle 0, honk rides along in
# parallel (in case the arrival honk missed), all pips to engines, lock the
# star (nav panel row 0), THROTTLE 100, pitch it 180 astern (hollow dot,
# centered), wait the smack cooldown out (flag-gated), then the ESCAPE
# VECTOR dance the smack charge demands: deselect (star is perfectly
# behind, T clears), press supercruise until a charge is LIVE — at that
# moment the game spawns a never-before-seen escape-vector target on the
# compass, like a next-system hop — orient_compass centers that clear
# circular target, hold_alignment rides it to SupercruiseEntry. Then lock
# the hop, throttle 100 again (SC entry resets it), 13s clear of the star,
# orient, jump.
#
# Retry split (operator): "if fail in real space go to 0, if fail in
# supercruise go to 6" — retry_from hits the FIRST set_throttle (step 0);
# the hop lock carries retry_anchor = true, so required failures at or
# after it return THERE instead.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock — no input sent
#   hold    key down → event → key up; used in parallel honk track
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
#   vision  closed-loop pitch/yaw + frame capture — EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]   # operator 0.5: re-honk in case the earlier one missed; an already-honked system just times the hold out in parallel

[on_required_fail]
retry_from = "set_throttle"   # first occurrence = step 0 — real-space restart
max_retries = 3
backoff_s = 2.0

steps = [
  # ── Real-space recovery during the smack cooldown ────────────────────────
  { action = "set_throttle", pct = 0 },                                                       # tap    | 0 kill thrust
  { action = "pips_engines" },                                                                # tap    | 0.6 all pips ENG
  { action = "nav_panel_target", required = true },                                           # macro  | 1 EXCLUSIVE — star = row 0; compass-verified lock
  { action = "set_throttle", pct = 100 },                                                     # tap    | 2 full burn through the flip (operator order)
  # timeout_s/max_iters are FAILSAFE ceilings (the gate is the compass read,
  # never the clock); center_frac 0.35 = "hollow dot and center" with ~0.07
  # read noise headroom (2026-06-06 run 5).
  { action = "pitch_compass", until = "behind", required = true, center_frac = 0.35, timeout_s = 75.0, max_iters = 40 },  # vision | 3 pitch 180 — star astern
  { action = "wait_cooldown_clear", required = true },                                        # wait   | 4 smack cooldown — FsdCooldown flag-gated, no timer
  { action = "target_ahead" },                                                                # tap    | 4.5 T — star astern, nothing ahead -> deselect
  # until_charging: success = a LIVE CHARGE, not entry — the charge is what
  # spawns the escape vector. ED refuses the press while still deep in the
  # exclusion zone — re-press every 15s (max 3); 240s is the wedged-FSD
  # watchdog, never a success gate. A re-press is only sent when no charge
  # ever started in its window (re-pressing a live charge would CANCEL it).
  { action = "engage_supercruise", required = true, until_charging = true, presses = 3, between_press_s = 15.0, max_charge_s = 240.0 },  # gated  | 5 press until a charge is LIVE
  { action = "orient_compass", required = true },                                             # vision | 5.5 center the spawned escape-vector dot
  { action = "hold_alignment", until_event = "SupercruiseEntry", required = true },           # vision | 5.6 hold the vector to SC entry

  # ── In supercruise: lock the hop, clear the star, jump ───────────────────
  { action = "target_next_route", required = true, retry_anchor = true },                     # gated  | 6 hop lock — SC failures return HERE
  { action = "set_throttle", pct = 100 },                                                     # tap    | 7 SC entry reset the throttle
  { action = "wait", s = 13.0 },                                                              # wait   | 7.5 fly clear of the star — TRAJECTORY PACING, not a gate
  { action = "orient_compass", required = true },                                             # vision | 8 EXCLUSIVE coarse
  { action = "orient_widget_ring", required = true },                                         # vision | 9 fine (no-op unless [vision].widget_ring_alignment)
  { action = "engage_jump", required = true },                                                # gated  | 10 FSD jump
  { action = "hold_alignment", required = true },                                             # vision | 11 hold cone until StartJump — event/state-gated, no clock
]
