# Runs on every LIVE FSDJump (you arrive in supercruise). Orbit AROUND the star
# so a next-hop hidden behind it becomes reachable, THEN orient + jump.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock â€” no input sent
#   hold    key down â†’ event â†’ key up; used in parallel honk track
#   macro   multi-key UI-state sequence â€” EXCLUSIVE, owns input
#   vision  closed-loop pitch/yaw + frame capture â€” EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]

[on_required_fail]
retry_from = "sc_assist_orbit"   # re-orbit changes geometry; re-orienting alone would just fail again
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "set_throttle", pct = 0 },             # tap    | 0
  # Pitch-star-first (ADDED 2026-06-06: 2 of 4 arrivals smacked ~25s after
  # FSDJump â€” the ship arrives nose-INTO the star and the SC-assist
  # acquisition starts from that pose; the operator's standing rule is the
  # star goes off-axis BEFORE anything else flies). Verified star lock
  # replaces the blind target_ahead deselect; the orbit macro re-targets
  # row 0 itself, so the lock is compatible.
  # BEST-EFFORT (required=false, 2026-06-06 run 13): a far secondary star's
  # tiny dot sits on the filled/hollow classifier boundary and the bit
  # flips every 1-3 beats at a stable position -- the pitch can stall on
  # noise. A failed pitch must not block the arrival the orbit-first flow
  # handled fine; a successful one still removes the nose-into-star pose.
  { action = "nav_panel_target" },                                                                     # macro  | 1 best-effort local-star lock
  { action = "pitch_compass", until = "behind", center_frac = 0.35, timeout_s = 75.0, max_iters = 40 },  # vision | 1b star astern FIRST (best effort)
  { action = "sc_assist_orbit" },                    # macro  | 2 EXCLUSIVE â€” nav panel macro (from the safe lane)
  { action = "wait", s = 13.0 },                     # wait   | 3 let orbit acquire
  # OUTWARD fly-out (REDESIGN 2026-06-06 15:55, MO-O b7-1): the old flow
  # throttled 100 and flew wherever the post-orbit nose pointed, then
  # hold_alignment flew TOWARD THE HOP during the charge. For a hop on the
  # far side of the star ("starward"), that never gains jump altitude --
  # 4 perfectly-aligned holds in a row sat blocked ("TOO CLOSE") and the
  # arrival ended in a smack. Fly-out must be RADIALLY OUTWARD regardless
  # of hop bearing: re-lock the local star, pitch it astern, burn 26s,
  # THEN turn to the hop. Best-effort like step 1b: a noisy pitch falls
  # through to the old behavior, never blocks.
  { action = "nav_panel_target" },                                                                     # macro  | 3b re-lock local star
  { action = "pitch_compass", until = "behind", center_frac = 0.35, timeout_s = 75.0, max_iters = 40 },  # vision | 3c nose radially outward
  { action = "set_throttle", pct = 100 },            # tap    | 3d
  { action = "wait", s = 26.0 },                     # wait   | 3e altitude burn -- TRAJECTORY PACING, not a gate
  { action = "target_next_route", required = true },                  # gated  | 4
  { action = "wait", s = 6.0 },                      # wait   | 5 keep burning while the lock settles
  { action = "orient_compass", required = true },        # vision | 7 coarse
  { action = "orient_widget_ring", required = true },    # vision | 8 fine (no-op unless [vision].widget_ring_alignment)
  { action = "engage_jump", required = true },           # gated  | 9 FSD jump
  { action = "hold_alignment", required = true },        # vision | 10 hold cone until StartJump â€” event/state-gated, no clock
]
