# Runs on every LIVE FSDJump (you arrive in supercruise) and on a bot restart
# while already in supercruise. Operator-dictated flow (2026-06-07): scoop if
# needed, orbit the star with SC assist, then target the hop and jump.
#
# REDESIGN 2026-06-07 (operator, line-by-line review): the pitch-astern +
# outward-burn climb-out (nav_panel_target -> pitch_compass behind ->
# 40s burn, added 2026-06-06) is GONE — the SC-assist orbit alone is the
# get-around, and 13s at 100% after the hop lock is the clearance burn.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock — no input sent
#   hold    key down → event → key up; used in parallel honk track
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
#   vision  closed-loop pitch/yaw + frame capture — EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]   # honk fires every system, no matter what

[on_required_fail]
# nav_panel_target (was sc_assist_orbit, 2026-06-07 council): a retry must
# re-establish the LOCK and the POSE — re-orbiting alone can't fix a wrong
# lock or an off-star nose, which are the two ways the lane actually fails.
retry_from = "scoop_refuel"
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "set_throttle", pct = 0 },             # tap    | 1 in case hyperspace auto-dethrottle is off
  # EARLY STAR LOCK (operator 2026-06-08): lock the arrival star NOW, during the
  # scoop idle, so on scoop exit sc_assist_orbit engages immediately on an
  # already-locked star ("taking the targeting step off of refueling resulted in
  # supercruise assist not catching" — the assist needs a LOCKED target to grab).
  # Mirrors startup.toml's proven bare nav_panel_target re-lock (steps 2/14):
  # best-effort (required defaults false), and CRUCIALLY no skip_to / no max_rows.
  # A not-found here returns False and advances ONE step INTO the scoop — it can
  # NEVER vault past it (a skip_to="target_next_route" on THIS step would jump
  # OVER the scoop on a far star — forbidden). The CLOSE/FAR orbit-vs-direct
  # decision stays on the BOUNDED gate below (the one with skip_to + max_rows=3),
  # which still re-locks/verifies the star right before the orbit. Wide default
  # bound on purpose: this lock's only job is to grab the star for the assist;
  # the far-skip decision lives on the bounded gate, not here.
  { action = "nav_panel_target" },                  # macro  | 1b EXCLUSIVE — early best-effort star lock (no skip_to, wide bound)
  # Scoop pit stop. GATE: fuel < refuel_below AND arrival star KGBFOAM (last
  # hyperspace StartJump StarClass) — else SKIP straight to the star lock.
  # Nose in at 25% until ScoopingFuel, keep closing until the observed rate
  # hits standoff_frac of the 6A's 0.878 t/s table max, cut throttle, drink
  # until full (log-driven; Status.json fuel reads). standoff_frac IS the
  # distance control: the rate fraction dictates a dynamic standoff from the
  # exclusion zone. 0.80 = test value (operator 2026-06-07; was 0.50) — will
  # be pushed toward 1.0 once proven. budget_s is a FAIL backstop only.
  # BEST-EFFORT: skip/fail never blocks the orbit below.
  { action = "scoop_refuel", approach_pct = 25, standoff_frac = 0.80, rate_window_s = 2.0, budget_s = 300.0, refuel_below = 0.70, full_epsilon = 0.2 },  # gated  | 2 pit stop
  # Star lock is IDENTITY-VERIFIED (2026-06-07 council, 10:30Z incident: row 0
  # was the NAV BEACON in populated Acihaut and the "verified" lock passed on
  # the beacon's compass dot). The step scrolls past non-star rows and fails
  # closed — a wrong body is NEVER returned as a lock.
  #
  # LOCK-SPEED get-around gate (council-ratified conditional-orbit fix,
  # 2026-06-07 redesign): star obstruction of a jump is DISTANCE-based, and the
  # nav panel sorts by CURRENT distance. So "can I lock the star in the top few
  # rows?" IS the distance signal. max_rows = 3 bounds the scan tight (row 0 =
  # beacon/star, + slack for a beacon/station ahead of a close star):
  #   FOUND fast (CLOSE)     -> True  -> run sc_assist_orbit (the safety
  #                                       get-around, as before).
  #   NOT found (FAR, buried)-> False -> NOT required + skip_to vaults the whole
  #                                       get-around block (sc_assist_orbit + its
  #                                       wait) straight to target_next_route;
  #                                       far = obstruction negligible = safe to
  #                                       jump direct. No grind, no abort.
  # NOT required (was required): a not-found must SKIP, not retry — retry_from
  # below still anchors the LATER required steps (orient/engage_jump) here.
  { action = "nav_panel_target", required = false, skip_to = "target_next_route", max_rows = 3 },  # macro  | 3 EXCLUSIVE — verified star lock, bounded (lock-speed gate)
  # (3b orient-to-star DROPPED 2026-06-07 phase-1: operator call — the
  # post-refuel pose engages the assist fine without it; "I think it's
  # moot." First live refuel + orbit ran clean.)
  # Orbit is guarded now (in-SC + local-star destination, fail closed, logs
  # ScAssistOrbitSent destination=X) but stays BEST-EFFORT: a refused orbit
  # degrades to the direct-jump path below — the marathon's proven-good
  # flow. ED exposes no assist-engaged flag; live iteration owns proving
  # actual engagement.
  { action = "sc_assist_orbit" },                    # macro  | 4 EXCLUSIVE — guarded SC-assist orbit
  { action = "wait", s = 13.0 },                    # wait   | 5 let orbit acquire
  # OPT-IN body tour (config [exploration].body_tour_enabled; OFF == byte-identical).
  # Tours the arrival system's bodies (SC-assist orbit each, AutoScan-gated) then
  # falls through to target_next_route. Best-effort (required defaults false): it
  # can NEVER block the jump, and stays in supercruise the whole time (resume jump
  # is from SC). Far-star automatic skip: step 3's skip_to="target_next_route"
  # vaults steps 4+5+5b on a far star, so the tour runs ONLY on the close-star path.
  { action = "explore" },                             # macro  | 5b autoexplore tour (C4); OFF == no-op inert, resumes in SC
  { action = "station_strand_recovery" },             # macro  | 5c PIN-C: wired strand-recovery after explore drop
  { action = "target_next_route", required = true },                # gated  | 6 lock the NEXT SYSTEM in route
  { action = "set_throttle", pct = 100 },           # tap    | 7 burn
  { action = "orient_compass", required = true },        # vision | 8a coarse align to the hop
  { action = "orient_widget_ring", required = true },    # vision | 8b fine (no-op unless [vision].widget_ring_alignment)
  { action = "engage_jump_clearance", required = true }, # gated  | 9 FSD jump + clearance loop (replaces wait@8 + engage_jump@10 + hold_alignment@11)
]
