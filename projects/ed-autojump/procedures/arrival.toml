# Runs on every LIVE FSDJump (you arrive in supercruise) and on a bot restart
# while already in supercruise. Operator-dictated flow (2026-06-07): scoop if
# needed, orbit the star with SC assist, then target the hop and jump.
#
# REDESIGN 2026-06-07 (operator, line-by-line review): the pitch-astern +
# outward-burn climb-out (nav_panel_target -> pitch_compass behind ->
# 40s burn, added 2026-06-06) is GONE — the SC-assist orbit alone is the
# get-around, and 13s at 100% after the hop lock is the clearance burn.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock — no input sent
#   hold    key down → event → key up; used in parallel honk track
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
#   vision  closed-loop pitch/yaw + frame capture — EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]   # honk fires every system, no matter what

[on_required_fail]
retry_from = "sc_assist_orbit"   # re-orbit changes geometry; re-orienting alone would just fail again
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "set_throttle", pct = 0 },             # tap    | 1 in case hyperspace auto-dethrottle is off
  # Scoop pit stop. GATE: fuel < refuel_below AND arrival star KGBFOAM (last
  # hyperspace StartJump StarClass) — else SKIP straight to the star lock.
  # Nose in at 25% until ScoopingFuel, keep closing until the observed rate
  # hits standoff_frac of the 6A's 0.878 t/s table max, cut throttle, drink
  # until full (log-driven; Status.json fuel reads). standoff_frac IS the
  # distance control: the rate fraction dictates a dynamic standoff from the
  # exclusion zone. 0.80 = test value (operator 2026-06-07; was 0.50) — will
  # be pushed toward 1.0 once proven. budget_s is a FAIL backstop only.
  # BEST-EFFORT: skip/fail never blocks the orbit below.
  { action = "scoop_refuel", approach_pct = 25, standoff_frac = 0.80, rate_window_s = 2.0, budget_s = 300.0, refuel_below = 0.70, full_epsilon = 0.2 },  # gated  | 2 pit stop
  { action = "nav_panel_target" },                  # macro  | 3 EXCLUSIVE — star = nav panel row 0 (closest body)
  { action = "sc_assist_orbit" },                   # macro  | 4 EXCLUSIVE — SC-assist orbit around the star
  { action = "wait", s = 13.0 },                    # wait   | 5 let orbit acquire
  { action = "target_next_route", required = true },                # gated  | 6 lock the NEXT SYSTEM in route
  { action = "set_throttle", pct = 100 },           # tap    | 7 burn
  { action = "wait", s = 13.0 },                    # wait   | 8 clear the star — TRAJECTORY PACING, not a gate
  { action = "orient_compass", required = true },        # vision | 9a coarse align to the hop
  { action = "orient_widget_ring", required = true },    # vision | 9b fine (no-op unless [vision].widget_ring_alignment)
  { action = "engage_jump", required = true },           # gated  | 10 FSD jump
  { action = "hold_alignment", required = true },        # vision | 11 hold cone until StartJump — event/state-gated, no clock
]
