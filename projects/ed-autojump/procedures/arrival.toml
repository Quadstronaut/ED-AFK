# ARRIVAL — runs on every LIVE FSDJump (you arrive in supercruise) and on a bot
# restart while already in supercruise. REWIRED 2026-06-27 (flow-redesign #1):
# the jump TAIL (target_next_route -> orient -> engage_jump_clearance) is GONE.
# Traversal owns the onward hop, and run_arrival_then_branch chains arrival ->
# (docking|exploration|traversal) AFTER this proc returns. Keeping the tail here
# is what caused the DOUBLE JUMP (arrival jumps, then traversal jumps again);
# stripping it is the fix. Arrival now does exactly three things: cut throttle,
# scoop if low, and SC-assist the arrival star — then hands off.
#
# Operator-authored flow (MASTER-SPEC "Arrival"):
#   1. set_throttle 0
#   2. honk_dscanner  (the parallel honk track — begins immediately, non-blocking)
#   3. scoop_refuel   (NEW trigger 50% — was the 2026-06-22 always-top-off 1.0)
#   4. nav_supercruise_star  (image #6 — SC-assist the row-0 arrival star)
#   5. branch (owned by the orchestrator, NOT a step here):
#        current system == destination -> Docking
#        elif exploration == active     -> Exploration
#        else                           -> Traversal
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
parallel_tracks = ["honk"]   # honk fires every system, no matter what (step 2)

[on_required_fail]
# A required nav_supercruise_star fail re-runs from the scoop: a retry must
# re-settle the post-scoop pose the SC-assist grab relies on, not just re-press
# the button. On terminal failure arrival ABORTS but the orchestrator still
# branches (abort != _transition_aborted); the fail-closed backstop is
# traversal's engage_jump_clearance clearance loop (an obstructed jump fails
# closed there). (C3 sketch / D-B.)
#
# max_retries 3 -> 1 (OPERATOR 2026-07-06, run 085221: four identical panel-
# open cycles on a deterministic CV refusal — "we do shit once"). Transient
# bad frames are now absorbed IN-STEP (nav_supercruise_star re-reads the row
# and the label in place within ONE panel open), so the procedure-level retry
# only covers pose/state disturbances; one re-settle pass, then abort loudly.
retry_from = "scoop_refuel"
max_retries = 1
backoff_s = 2.0

steps = [
  # tap | 1 cut throttle in case hyperspace auto-dethrottle is off.
  { action = "set_throttle", pct = 0 },
  # gated | 3 scoop pit stop. GATE: arrival star scoopable (KGBFOAM, last
  # hyperspace StartJump StarClass) and tank not already full (full_epsilon).
  # refuel_below = 0.75 (OPERATOR 2026-07-06 final: scoop when tank under
  # three-quarters; supersedes same-day 1.0 restore and council-A's 0.50 —
  # 0.50 drained tank live, run 102104). approach_pct = 50 (operator order:
  # "go forward at 50% throttle until at maximum refuel rate"), rate gate
  # stays standoff_frac = 0.80 of the equipped scoop's table max — the
  # live-validated cut-throttle point. The is_scoopable gate still skips
  # non-scoopable classes; the stale-arrival guard still holds. BEST-EFFORT:
  # a skip/fail never blocks the star lock below.
  { action = "scoop_refuel", approach_pct = 50, standoff_frac = 0.80, rate_window_s = 2.0, budget_s = 300.0, refuel_below = 0.75, full_epsilon = 0.2 },  # gated | 3 pit stop
  # macro | 4 SC-assist the ARRIVAL STAR (nav-panel row 0, blind-fire with a #8
  # label CONFIRM). Replaces the old blind sc_assist_orbit. REQUIRED: on a
  # terminal fail arrival aborts (retry_from re-settles at the scoop); the onward
  # branch's own clearance loop is the fail-closed backstop. The arrival star is
  # ALWAYS row 0 (memory arrival-star-row0-blind-sc-assist) — no search, CV only
  # confirms the SUPERCRUISE ASSIST button label before the press.
  { action = "nav_supercruise_star", required = true },  # macro | 4 EXCLUSIVE — SC-assist the arrival star
]
