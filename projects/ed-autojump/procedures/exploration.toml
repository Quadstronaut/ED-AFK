# EXPLORATION — the in-system body tour (MASTER-SPEC "Exploration"). Reached
# from run_arrival_then_branch when exploration == active (body_tour_enabled) on
# an onward hop. DISTINCT procedure / distinct overlay label — NOT a traversal
# alias.
#
# Operator-authored intent (MASTER-SPEC, jump tail per the operator's
# 2026-07-07 reorg 70c248e):
#   1. nav_supercruise_unexplored  (LOOP until the `✦` system icon is at the row
#      selector — the list-bottom terminator)
#   2. -> the terminal jump tail BELOW (target/orient/jump)
#
# The LOOP is the SCENE's job, not the step's (council #4): nav_supercruise_
# unexplored does ONE body per call and the interpreter's loop_to back-edge
# repeats the between-body body (throttle/orient/confirm/wait) until the step
# returns False on the `✦` terminator (or an unreadable list). The tour then
# jumps out ITSELF via the terminal tail — the old C2-D5 exploration->traversal
# chain was REMOVED (G2, 2026-07-11): it double-pressed this tail's jump keys.
# Exploration is a TERMINAL branch, exactly like docking and traversal.
#
# BEST-EFFORT loop, REQUIRED tail: the loop's correctness rests on
#   (a) nav_supercruise_unexplored's skip_to="target_next_route" exit on False,
#   (b) the loop_max cap on the set_throttle back-edge (fail-closed budget),
#   (c) should_abort, checked every step by the interpreter.
# Any read failure exits the loop and jumps on — never drives blind.
#
# BLOCKED-ON-KYLE carried, not resolved:
#   BK-1  wait_body_scanned gates on the AutoScan seq-advance; confirm AutoScan
#         (not Scan / FSSBodySignals) is the right per-body edge live.
#
# step kinds:
#   macro   multi-key UI-state sequence — EXCLUSIVE, owns input
#   tap     atomic keypress, no precondition
#   vision  closed-loop pitch/yaw + frame capture — EXCLUSIVE, owns input + screen
#   observe reads the screen, presses nothing (never gates)
#   wait    passive block on a journal edge — no input sent
[on_required_fail]
retry_from = "nav_supercruise_unexplored"
max_retries = 3
backoff_s = 2.0

steps = [
  # HONK, inlined (operator: the parallel honk track "never fired", and
  # { action = "honk" } does NOT parse -- honk is a PROCEDURE, not a step
  # action). These are honk.toml's two real steps, run BLOCKING here so the
  # discovery scan reliably REVEALS the system's bodies before the tour reads
  # the nav list (no honk -> nothing discovered -> nothing to explore). Fires
  # ONCE per system: the loop_to back-edge below re-enters at
  # nav_supercruise_unexplored, past these. ensure_analysis_mode stays required
  # AND first -- PrimaryFire in the COMBAT HUD is live weapons.
  { action = "ensure_analysis_mode", required = true },
  { action = "hold_until_event", bind = "PrimaryFire", event = "FSSDiscoveryScan" },
  { action = "target_ahead" },
  # skip_to RESTORED (it was dropped in the prior edit -- the root cause of
  # "won't turn toward anything / won't skip a star-only system"). This step's
  # contract is required=false + skip_to: on False (SYSTEM terminator = no more
  # unexplored bodies, star-only, unreadable, or CV-refused) it MUST vault to the
  # jump tail. Without skip_to a False fell THROUGH to the body-tour steps with no
  # target -> orient had nothing to steer to and the required orient_widget_ring
  # then failed-retried instead of jumping on.
  { action = "nav_supercruise_unexplored", skip_to = "target_next_route" },
  { action = "set_throttle", pct = 25 },
  { action = "orient_compass" },
  { action = "orient_widget_ring", required = true },
  { action = "confirm_sc_assist_active" },
  { action = "wait_sc_assist_orbiting" },
  { action = "confirm_orbiting" },
  { action = "wait_body_scanned" },
  { action = "target_ahead" },
  { action = "set_throttle", pct = 100 },
  { action = "wait", s = 4.20 },
  { action = "set_throttle", pct = 0, loop_to = "nav_supercruise_unexplored", loop_max = 128 },
  { action = "target_next_route" },
  { action = "set_throttle", pct = 100 },
  { action = "wait", s = 4.20 },
  { action = "set_throttle", pct = 75 },
  { action = "orient_compass", required = true },
  { action = "orient_widget_ring", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "engage_jump_clearance", required = true },
]
