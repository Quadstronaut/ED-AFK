# STARTUP — fresh load: ship sits in NORMAL SPACE (usually parked at a star).
# A bot restarted while already IN SUPERCRUISE routes to arrival.toml /
# sc_resume.toml instead (dispatcher._maybe_startup).
#
# CV REWIRE 2026-07-05 (operator: "CV distance gate, two lanes"): the blind
# clear-of-star trio (nav_panel_target max_rows=3 -> sc_assist_orbit ->
# wait 13s) and the whole inline recovery lane (old steps 11-23) are GONE.
# #27 (the 13s wait) and #28 (max_rows=3) died with the blind flow, as
# operator-ratified 2026-06-27.
#
#   THROTTLE   set_throttle(100) FIRST — ED REFUSES SC entry at zero throttle
#              (live 2026-07-06, run 000806: Supercruise pressed parked at the
#              star, ship hung at the THROTTLE UP prompt, no SupercruiseEntry
#              ever came). Operator reordered live. This supersedes the
#              2026-06-08 "no throttle before the gate" law IN THIS SCENE
#              ONLY — sc_resume (already in SC, no SC entry) keeps it. The
#              burn window at a maybe-near star is the gate read (~1.5s);
#              right after, the CLOSE lane's SC entry / get-around owns it.
#   LANE GATE  star_distance_gate — CV: open panel, OCR row 0 (the closest
#              in-system row, selected on open — usually the arrival star,
#              but a beacon/signal can sort first [live 2026-07-06]; either
#              way row-0 distance is a sound "am I near the star" proxy),
#              close panel. < 100 Ls or UNREADABLE -> CLOSE lane (fail-closed:
#              the 2026-06-08 normal-space star-ram fix, now with a real
#              distance read instead of the lock-speed proxy). >= 100 Ls ->
#              skip_to vaults straight to the direct jump (~100 Ls = the
#              settled obstruction floor, ed-fsd-obstruction-distance).
#   CLOSE lane enter supercruise (throttle already up; in normal space you
#              cannot SC-assist, so SC entry precedes the orbit), then
#              nav_supercruise_star (CV-confirmed lock+assist, replaces the
#              blind re-lock + sc_assist_orbit), then wait for the cyan
#              ORBITING DESTINATION HUD prompt (CV, bounded poll — replaces
#              the blind 13s: the prompt IS "the orbit has the ship moving
#              off the star", which is what the 13s guessed at).
#   SHARED     lock next hop (cancels the assist) -> orient ->
#              engage_jump_clearance (obstruction fails closed there and
#              move-retries — the fail-closed backstop for both lanes).
#
# RETRY (LIVE FIX 2026-07-06, run 010444 starsmack — supersedes the 07-05
# target_next_route anchor): retries re-run from the CLEAR-OF-STAR GATE. The
# old anchor let a CLOSE-lane required fail (nav_supercruise_star refused)
# retry INTO the far lane — throttle 100 + orient + jump with the nose still
# on the star; that exact path drove the ship into L 32-8. Re-gating on every
# retry costs one cheap CV read when the ship is genuinely clear (gate says
# FAR -> skip_to as normal) and re-runs the get-around when it is not — the
# gate is the in-scene backstop and now no retry can bypass it. Note the
# 07-05 "engage_supercruise fail exhausts to abort" property is traded away:
# an SC-entry fail now re-runs the gate + SC entry up to max_retries, then
# aborts to human.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   vision  CV read / closed-loop steer — EXCLUSIVE where it owns input
#   wait    passive block on journal event / Status flag or CV poll — no input
#   hold    key down → event → key up; used in parallel honk track
parallel_tracks = ["honk"]

[on_required_fail]
retry_from = "star_distance_gate"
max_retries = 3
backoff_s = 2.0

steps = [
  { action = "set_throttle", pct = 0 },
  { action = "star_distance_gate", skip_to = "target_next_route", threshold_ls = 10.0 },
  { action = "set_throttle", pct = 100 },
  { action = "engage_supercruise", required = true, escape_vector_abort = true },
  { action = "nav_supercruise_star", required = true },
  { action = "wait_sc_assist_orbiting" },
  { action = "wait", s = 3.0 },
  { action = "target_next_route", required = true },
  { action = "set_throttle", pct = 75 },
  { action = "wait", s = 3.0 },
  { action = "orient_compass", required = true },
  { action = "orient_widget_ring", required = true },
  { action = "set_throttle", pct = 100 },
  { action = "engage_jump_clearance", required = true },
]
