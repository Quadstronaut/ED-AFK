# Fresh load: ship sits at a star in NORMAL SPACE. That scene only — a bot
# restarted while the ship is already IN SUPERCRUISE is routed to arrival.toml
# instead (dispatcher._maybe_startup, 2026-06-06): an in-supercruise restart
# sits nose-on at its last arrival star, and this procedure's throttle-100-
# then-orient dove straight into the scoop zone (FuelScoop 13:26:17 ->
# SupercruiseExit Body=Star 13:26:21 — the star smack). arrival.toml orbits
# the star and clears it BEFORE throttling up.
#
# First attempt: throttle up, lock the next route star, orient on compass
# (coarse) then widget ring (fine), fire the FSD, then hold_alignment â€” a
# PURE EVENT-DRIVEN gate that keeps the dot in the charge cone and exits on
# the game's own signals: StartJump journal event / FsdJump flag = success;
# FsdCharging trueâ†’false without either = the game aborted the charge =
# failure. NO wall-clock timeout (no-arbitrary-timed-waits): the old 12s
# wait_for_event gate expired mid-spool on a healthy charge and the recovery
# path's SelectTarget/Supercruise presses cancelled the jump (2026-06-01,
# 2026-06-06 sessions).
#
# Recovery is only ever entered when the charge has GENUINELY dropped â€”
# hold_alignment cannot fail while FsdCharging is set â€” so its keypresses
# can no longer kill a live jump.
#
# step kinds (tag at start of each step comment):
#   tap     atomic keypress, no precondition, no wait
#   gated   keypress with Status.json precondition (fails closed on bad flag)
#   wait    passive block on journal event or clock â€” no input sent
#   hold    key down â†’ event â†’ key up; used in parallel honk track
#   macro   multi-key UI-state sequence â€” EXCLUSIVE, owns input
#   vision  closed-loop pitch/yaw + frame capture â€” EXCLUSIVE, owns input + screen
parallel_tracks = ["honk"]

[on_required_fail]
retry_from = "target_ahead"
max_retries = 1
backoff_s = 2.0

steps = [
  # â”€â”€ First-try direct jump â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  { action = "set_throttle", pct = 100 },                  # tap    | 0
  { action = "target_next_route", required = true },                        # gated  | 1
  { action = "orient_compass", required = true },          # vision | 2 coarse
  { action = "orient_widget_ring", required = true },      # vision | 3 fine (no-op unless [vision].widget_ring_alignment)
  { action = "engage_jump", required = true },             # gated  | 4 press FSD combo
  { action = "hold_alignment", required = true },          # vision | 5 hold cone until StartJump â€” event/state-gated, no clock

  # â”€â”€ Recovery: retry_from lands here when any required step above fails â”€â”€â”€
  { action = "target_ahead" },                             # tap    | 6 deselect (no target ahead â†’ clears)
  { action = "engage_supercruise", required = true },      # gated  | 7 event/state-gated on SupercruiseEntry
  { action = "set_throttle", pct = 100 },                  # tap    | 8
  { action = "target_next_route", required = true },                        # gated  | 9
  { action = "orient_compass", required = true },          # vision | 10 coarse
  { action = "orient_widget_ring", required = true },      # vision | 11 fine
  { action = "engage_jump", required = true },             # gated  | 12 press FSD combo
  { action = "hold_alignment", required = true },          # vision | 13 hold cone until StartJump
]
