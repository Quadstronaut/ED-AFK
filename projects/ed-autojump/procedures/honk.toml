# The one parallel track. Hold the Discovery Scanner key until the journal
# logs FSSDiscoveryScan (scan-completed confirmation), capped at 12s.
# The press_until_event step owns the event + timeout; the parallel header
# fields stop_on_event/timeout_s remain reserved (not enforced by v1).
parallel = true
steps = [
  { action = "press_until_event", bind = "ExplorationFSSDiscoveryScan", event = "FSSDiscoveryScan", timeout_s = 12.0 },
]
