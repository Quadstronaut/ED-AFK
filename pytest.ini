# Workspace-root pytest config — runs the FULL ED-AFK suite across all five
# packages from ONE command at the repo root. Each package is installed editable
# into the shared .venv (projects/ed-autojump/.venv), so `import ed_core` /
# `ed_vision` / `ed_autojump` / `ed_explore` / `ed_combat` resolve regardless of
# which package's tests/ dir a test lives in.
#
# Phase-1 reorg: tests relocate into each package's tests/ dir as their code
# moves (Steps 2-5). testpaths lists every package's tests dir; non-existent
# dirs are simply skipped by collection, so this config is stable across the
# in-progress reorg. The marker config + `-m 'not requires_game'` mirror the
# pre-reorg ed-autojump config so the pinned 16-red / 1581-green invariant holds
# from the repo root exactly as it did inside projects/ed-autojump.
[pytest]
testpaths =
    projects/ed-autojump/tests
    projects/ed-core/tests
    projects/ed-vision/tests
    projects/ed-explore/tests
    projects/ed-combat/tests
asyncio_mode = auto
markers =
    requires_game: tests that need the live Elite Dangerous game running (skipped by default)
    slow: long-running tests
addopts = -q -m 'not requires_game'
